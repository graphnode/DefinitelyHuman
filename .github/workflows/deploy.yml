name: Deploy

# Every push to master goes to production. Pre-release work lives on feature branches.
on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one.
concurrency: deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish DefinitelyHuman -c Release -o out

      # The key is pinned on the server to Scripts/deploy-receive.sh (a forced command), which
      # unpacks the build, restarts the service and fails this step if it does not come back up.
      - name: Upload and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C out -czf - . | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "root@$DEPLOY_HOST"
